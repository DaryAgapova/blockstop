services:
  - type: web
    name: blockstop
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: blockstop-db
          property: connectionString

databases:
  - name: blockstop-db
    databaseName: blockstop
    user: blockstop
