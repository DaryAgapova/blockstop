{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo"><i class="fas fa-fire-extinguisher"></i></div>
      <h2>Вход в аккаунт</h2>
      <p>МИР ПОЖАРНОЙ БЕЗОПАСНОСТИ</p>
    </div>
    <div class="auth-body">
      <form method="post" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
            <input type="email" name="email" class="form-control" placeholder="your@email.com" required autofocus>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" name="remember" class="form-check-input" id="remember">
          <label class="form-check-label" for="remember">Запомнить меня</label>
        </div>
        <button type="submit" class="btn btn-danger w-100 btn-lg">
          <i class="fas fa-sign-in-alt me-2"></i>Войти
        </button>
      </form>
    </div>
    <div class="auth-footer">
      Нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрироваться</a>
    </div>
  </div>
</div>
{% endblock %}
